<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100b1c">
<meta name="description" content="SOLO LEVELING — Arise. Learn. Train. Evolve.">
<link rel="manifest" href="manifest.json">
<title>SOLO LEVELING</title>
<style>
:root{--bg:#0b0912;--panel:#151020;--panel2:#1d1630;--line:#302447;--text:#f5f0ff;--muted:#aaa0bd;--purple:#a855f7;--purple2:#7c3aed;--cyan:#67e8f9;--green:#86efac;--red:#fca5a5;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#21103a 0,#0b0912 48%);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{max-width:1050px;margin:auto;padding:18px 16px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;gap:11px;align-items:center}.sigil{width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,#c084fc,#6d28d9);display:grid;place-items:center;font-size:23px;box-shadow:0 0 25px #9333ea55}.brand h1{font-size:18px;letter-spacing:2px;margin:0}.brand small{color:var(--muted);letter-spacing:1.5px;font-size:10px}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:9px 12px}.btn.primary{background:linear-gradient(135deg,#9333ea,#6d28d9);border-color:#a855f7;font-weight:650}.btn.ghost{background:transparent}.btn.danger{color:#fecaca}.nav{display:flex;gap:7px;overflow:auto;padding:4px 0 13px;scrollbar-width:thin}.nav button{white-space:nowrap;border:1px solid var(--line);background:#120e1d;color:var(--muted);border-radius:999px;padding:8px 13px}.nav button.active{background:#3b1b61;border-color:#a855f7;color:#fff}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.card{background:linear-gradient(160deg,#191326,#120f1b);border:1px solid var(--line);border-radius:var(--radius);padding:17px;min-width:0;box-shadow:0 10px 28px #0002}.span12{grid-column:span 12}.span8{grid-column:span 8}.span7{grid-column:span 7}.span6{grid-column:span 6}.span5{grid-column:span 5}.span4{grid-column:span 4}.eyebrow{font-size:11px;color:var(--cyan);letter-spacing:1.5px;font-weight:700}.muted{color:var(--muted)}h2{font-size:22px;margin:3px 0 13px}h3{font-size:15px;margin:0 0 8px}.hero{display:flex;align-items:center;justify-content:space-between;gap:15px}.level{font-size:38px;font-weight:800;line-height:1}.rank{color:#d8b4fe;font-size:12px;letter-spacing:2px}.bar{height:9px;border-radius:20px;background:#2c2438;overflow:hidden;margin:12px 0 5px}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#c084fc);border-radius:20px;transition:width .3s}.statrow{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#100d18;border:1px solid #2a2138;padding:10px 12px;border-radius:12px;min-width:95px;flex:1}.stat strong{display:block;font-size:20px}.stat small{color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.list{display:grid;gap:8px}.item{display:flex;align-items:center;gap:10px;border:1px solid #2b2239;background:#100d18;border-radius:12px;padding:10px}.item .grow{flex:1;min-width:0}.item strong{display:block;font-size:14px;overflow-wrap:anywhere}.item small{color:var(--muted)}.check{width:20px;height:20px;accent-color:#a855f7;flex-shrink:0}.pill{font-size:11px;color:#e9d5ff;border:1px solid #6941a5;background:#2c1747;padding:3px 7px;border-radius:20px;white-space:nowrap}.form{display:grid;gap:9px}.formrow{display:flex;gap:8px;flex-wrap:wrap}.field{width:100%;border:1px solid var(--line);background:#0d0a14;color:var(--text);border-radius:10px;padding:10px}.formrow .field{flex:1;min-width:130px}.textarea{min-height:100px;resize:vertical}.smallbtn{border:0;background:transparent;color:#c4b5fd;padding:4px 7px}.empty{padding:17px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.tilegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.tile{border:1px solid var(--line);background:#100d18;color:var(--text);padding:13px;border-radius:13px;text-align:left}.tile span{display:block;font-size:21px;margin-bottom:5px}.tile small{color:var(--muted)}.note{font-size:13px;color:var(--muted);background:#100d18;border-left:3px solid #8b5cf6;padding:10px 12px;border-radius:8px}.footer{text-align:center;color:#716783;font-size:11px;margin-top:20px}.hidden{display:none!important}.modal-back{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:15px;z-index:10}.modal{width:min(500px,100%);max-height:90vh;overflow:auto;background:#171122;border:1px solid #60418a;border-radius:18px;padding:18px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2e1b47;border:1px solid #a855f7;padding:10px 16px;border-radius:12px;z-index:20;box-shadow:0 6px 25px #0008}.question{font-size:19px;margin:10px 0}.answer{padding:11px;border:1px solid var(--line);border-radius:10px;margin:7px 0;background:#100d18}.answer.correct{border-color:#22c55e}.answer.wrong{border-color:#f87171}
@media(max-width:680px){.app{padding:13px 11px 80px}.span8,.span7,.span6,.span5,.span4{grid-column:span 12}.hero{align-items:flex-start}.top-actions .btn{padding:8px}.brand h1{font-size:15px}.card{padding:14px}h2{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="sigil">✦</div><div><h1>SOLO LEVELING</h1><small>ARISE. LEARN. TRAIN. EVOLVE.</small></div></div><div class="top-actions"><button class="btn ghost" id="installBtn" hidden>Install</button><button class="btn" id="settingsBtn" aria-label="Settings">⚙</button></div></header>
<nav class="nav" id="nav" aria-label="Main navigation"></nav>
<main id="view"></main>
<div class="footer">Your progress is saved on this device • Take breaks, grow at your pace.</div>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const sections=[
["system","✦","SYSTEM"],["academy","▤","ACADEMY"],["quests","⚔","QUESTS"],["train","⌁","TRAIN"],["develop","◇","DEVELOP"],["glow","✧","GLOW"],["health","♡","HEALTH"],["skills","⌘","SKILLS"],["people","◎","PEOPLE"],["profile","♙","PROFILE"],["settings","⚙","SETTINGS"]
];
const defaults=[
{title:"Review one class concept",section:"academy",xp:20,done:false},
{title:"Complete a short practice set",section:"academy",xp:25,done:false},
{title:"Take a movement break",section:"train",xp:10,done:false},
{title:"Read or learn for 15 minutes",section:"develop",xp:10,done:false},
{title:"Follow a simple skincare routine",section:"glow",xp:10,done:false},
{title:"Prepare for a restful night",section:"health",xp:10,done:false}
];
const initial={name:"Hunter",xp:0,level:1,quests:defaults,notes:[],subjects:["Physics","Chemistry","Mathematics"],chapters:[],skills:["Coding","Cooking","Communication","AI & digital literacy"],history:[],prefs:{enabled:["academy","train","develop","glow","health"],reminders:false},theme:"dark"};
let data;try{data=JSON.parse(localStorage.getItem("soloLevelingData"))||structuredClone(initial)}catch{data=structuredClone(initial)}
function save(){localStorage.setItem("soloLevelingData",JSON.stringify(data))}
let page="system",deferredInstall=null,exam={subject:"Physics",topic:"",step:0,selected:null,show:false};
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){$("#toastRoot").innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$("#toastRoot").innerHTML="",2300)}
function levelFor(xp){return Math.floor(Math.sqrt(Math.max(0,xp)/100))+1}
function rankFor(l){return l>=80?"SS":l>=60?"S":l>=40?"A":l>=25?"B":l>=15?"C":l>=7?"D":"E"}
function xpAt(l){return (l-1)*(l-1)*100}
function xpNext(l){return l*l*100}
function gain(n){data.xp=Math.max(0,data.xp+n);data.level=levelFor(data.xp);save()}
function nav(){ $("#nav").innerHTML=sections.map(([id,ic,label])=>`<button data-page="${id}" class="${page===id?"active":""}">${ic} ${label}</button>`).join("");$("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){page=p;nav();render()}
function shell(title,desc,body){return `<div class="grid"><section class="card span12"><div class="eyebrow">SYSTEM / ${esc(title.toUpperCase())}</div><h2>${esc(title)}</h2><div class="muted">${desc||""}</div></section>${body}</div>`}
function card(title,content,span="span6"){return `<section class="card ${span}"><h3>${title}</h3>${content}</section>`}
function questList(filter="all"){let qs=data.quests.filter(q=>filter==="all"|| (filter==="open"?!q.done:q.done));if(!qs.length)return `<div class="empty">No quests here yet. Add one to begin.</div>`;return `<div class="list">${qs.map((q,i)=>`<div class="item"><input class="check" type="checkbox" data-check="${data.quests.indexOf(q)}" ${q.done?"checked":""} aria-label="Complete ${esc(q.title)}"><div class="grow"><strong>${esc(q.title)}</strong><small>${esc(labelFor(q.section))} · ${q.xp} XP</small></div><button class="smallbtn" data-edit="${data.quests.indexOf(q)}" aria-label="Edit quest">✎</button><button class="smallbtn" data-delete="${data.quests.indexOf(q)}" aria-label="Delete quest">×</button></div>`).join("")}</div>`}
function labelFor(id){return sections.find(s=>s[0]===id)?.[2]||id}
function wireQuests(){document.querySelectorAll("[data-check]").forEach(el=>el.onchange=()=>{let q=data.quests[+el.dataset.check];if(!q)return;q.done=el.checked;gain(q.done?q.xp:-q.xp);if(q.done){data.history.unshift({title:q.title,date:new Date().toLocaleDateString(),xp:q.xp});toast(`Quest complete: +${q.xp} XP`)}save();render()});document.querySelectorAll("[data-delete]").forEach(el=>el.onclick=()=>{let i=+el.dataset.delete,q=data.quests[i];if(q.done)gain(-q.xp);data.quests.splice(i,1);save();render()});document.querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>editQuest(+el.dataset.edit))}
function addQuest(){modal(`<h3>Create a quest</h3><form id="questForm" class="form"><input class="field" name="title" placeholder="Quest name" required maxlength="90"><div class="formrow"><select class="field" name="section">${sections.filter(s=>!["system","quests","profile","settings"].includes(s[0])).map(s=>`<option value="${s[0]}">${s[2]}</option>`).join("")}</select><input class="field" name="xp" type="number" min="0" max="500" value="10" aria-label="XP reward"></div><button class="btn primary">Create quest</button></form>`);$("#questForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.quests.push({title:f.get("title").trim(),section:f.get("section"),xp:+f.get("xp"),done:false});save();closeModal();render();toast("Quest created")}}
function editQuest(i){let q=data.quests[i];modal(`<h3>Edit quest</h3><form id="editForm" class="form"><input class="field" name="title" value="${esc(q.title)}" required maxlength="90"><div class="formrow"><select class="field" name="section">${sections.filter(s=>!["system","quests","profile","settings"].includes(s[0])).map(s=>`<option value="${s[0]}" ${q.section===s[0]?"selected":""}>${s[2]}</option>`).join("")}</select><input class="field" name="xp" type="number" min="0" max="500" value="${q.xp}"></div><button class="btn primary">Save changes</button></form>`);$("#editForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),was=q.done,old=q.xp;q.title=f.get("title").trim();q.section=f.get("section");q.xp=+f.get("xp");if(was)gain(q.xp-old);save();closeModal();render()}}
function modal(html){$("#modalRoot").innerHTML=`<div class="modal-back" id="backdrop"><div class="modal">${html}<button class="btn ghost" id="closeModal" style="margin-top:10px">Close</button></div></div>`;$("#closeModal").onclick=closeModal;$("#backdrop").onclick=e=>{if(e.target.id==="backdrop")closeModal()}}
function closeModal(){$("#modalRoot").innerHTML=""}
function system(){let level=data.level,progress=(data.xp-xpAt(level))/(xpNext(level)-xpAt(level))*100,done=data.quests.filter(q=>q.done).length;return shell("System dashboard","Your personal growth system. Small, steady progress counts.",`
<section class="card span8"><div class="hero"><div><div class="eyebrow">CURRENT HUNTER</div><div style="font-size:24px;font-weight:750">${esc(data.name||"Hunter")}</div><div class="rank">RANK ${rankFor(level)}</div></div><div style="text-align:right"><div class="level">${level}</div><small class="muted">LEVEL</small></div></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,progress))}%"></span></div><div class="muted">${data.xp-xpAt(level)} / ${xpNext(level)-xpAt(level)} XP to next level</div></section>
${card("Today's progress",`<div class="statrow"><div class="stat"><strong>${done}</strong><small>Completed</small></div><div class="stat"><strong>${data.quests.length-done}</strong><small>Remaining</small></div><div class="stat"><strong>${data.xp}</strong><small>Total XP</small></div></div>`,"span4")}
${card("Quick actions",`<div class="tilegrid"><button class="tile" data-go="academy"><span>▤</span><b>Study</b><small>Chapters & practice</small></button><button class="tile" data-go="quests"><span>⚔</span><b>Quests</b><small>Manage tasks</small></button><button class="tile" data-go="train"><span>⌁</span><b>Move</b><small>Healthy activity</small></button><button class="tile" data-go="profile"><span>♙</span><b>Profile</b><small>Progress & history</small></button></div>`,"span12")}
${card("Daily quests",questList("open"),"span12")}
`)}
function academy(){return shell("Academy","Learn concepts, organize chapters, and practice at your own pace.",`
${card("Subjects",`<div class="tilegrid">${data.subjects.map(s=>`<button class="tile" data-subject="${esc(s)}"><span>▤</span><b>${esc(s)}</b><small>Open study tools</small></button>`).join("")}</div><form id="subjectForm" class="formrow" style="margin-top:10px"><input class="field" name="subject" placeholder="Add a subject" maxlength="50" required><button class="btn">Add</button></form>`,"span12")}
${card("Chapter tracker",`<form id="chapterForm" class="formrow"><input class="field" name="chapter" placeholder="Chapter or topic" required maxlength="90"><select class="field" name="subject">${data.subjects.map(s=>`<option>${esc(s)}</option>`).join("")}</select><button class="btn primary">Add chapter</button></form><div class="list" style="margin-top:10px">${data.chapters.map((c,i)=>`<div class="item"><input class="check" type="checkbox" data-chapter="${i}" ${c.done?"checked":""}><div class="grow"><strong>${esc(c.name)}</strong><small>${esc(c.subject)}</small></div><button class="smallbtn" data-chapter-del="${i}">×</button></div>`).join("")||`<div class="empty">Add your first chapter.</div>`}</div>`,"span7")}
${card("Personal examiner",`<p class="muted">Choose a subject and topic. The examiner starts with a concept reminder, then gives one question at a time. This starter version includes sample questions you can extend.</p><form id="examForm" class="form"><select class="field" name="subject">${data.subjects.map(s=>`<option>${esc(s)}</option>`).join("")}</select><input class="field" name="topic" placeholder="Topic (e.g., vectors, alkanes)" required><button class="btn primary">Start practice</button></form>`,"span5")}
${card("Study notes",`<form id="noteForm" class="form"><input class="field" name="title" placeholder="Note title" required maxlength="80"><textarea class="field textarea" name="body" placeholder="Write formulas, explanations, or reminders..." required></textarea><button class="btn">Save note</button></form><div class="list" style="margin-top:10px">${data.notes.map((n,i)=>`<div class="item"><div class="grow"><strong>${esc(n.title)}</strong><small>${esc(n.body)}</small></div><button class="smallbtn" data-note-del="${i}">×</button></div>`).join("")||""}</div>`,"span12")}`)}
function examiner(){let bank=[{q:"Which statement best describes a vector quantity?",a:["It has magnitude only","It has magnitude and direction","It has direction only","It has no unit"],correct:1,ex:"A vector has both magnitude and direction. Examples include displacement and velocity."},{q:"For a straight line y = mx + c, what does m represent?",a:["Y-intercept","X-intercept","Slope","Origin"],correct:2,ex:"In slope-intercept form, m is the slope and c is the y-intercept."},{q:"The general formula for an open-chain alkane with one ring absent is:",a:["CₙH₂ₙ₊₂","CₙH₂ₙ","CₙH₂ₙ₋₂","CₙHₙ"],correct:0,ex:"Acyclic saturated hydrocarbons (alkanes) have formula CₙH₂ₙ₊₂."}];return shell("Examiner",`Practice: ${esc(exam.subject)} · ${esc(exam.topic)}`,`${card("Concept first",`<div class="note">Before answering, recall the definition, key formula, and units from your class notes. These are sample questions; add your own topic-specific questions as you study.</div><p class="muted">Question ${exam.step+1} of ${bank.length}</p><div class="question">${bank[exam.step%bank.length].q}</div>${bank[exam.step%bank.length].a.map((a,i)=>`<button class="answer ${exam.show&&i===bank[exam.step%bank.length].correct?"correct":exam.show&&i===exam.selected?"wrong":""}" data-answer="${i}" ${exam.show?"disabled":""}>${"ABCD"[i]}. ${a}</button>`).join("")}${exam.show?`<div class="note" style="margin-top:10px">${bank[exam.step%bank.length].ex}</div><button class="btn primary" id="nextQ" style="margin-top:10px">Next question</button>`:""}`,"span12")}`)}
function simpleSection(id,title,desc,items){return shell(title,desc,`${card("Learning paths",`<div class="tilegrid">${items.map((it,i)=>`<button class="tile" data-learn="${esc(it)}"><span>${["✦","◇","⌁","▤"][i%4]}</span><b>${esc(it)}</b><small>Open checklist</small></button>`).join("")}</div>`,"span12")}${card("My routine",`<p class="muted">Add a personal task for this section using Quests. Choose a comfortable pace and take breaks when needed.</p><button class="btn primary" data-add-quest>Add a quest</button>`,"span12")}`)}
function glow(){return shell("Glow","Simple, gentle care—not perfection. Skin and appearance vary naturally.",`
${card("Simple skincare routine",`<div class="list"><div class="item"><div class="grow"><strong>Morning</strong><small>Gentle cleanser (if needed) → moisturizer → broad-spectrum sunscreen.</small></div></div><div class="item"><div class="grow"><strong>Evening</strong><small>Gentle cleanser → moisturizer. Keep it simple and consistent.</small></div></div></div><p class="note" style="margin-top:10px">Use products made for skin. Patch-test new products and stop if irritation occurs. Sunscreen should be a tested broad-spectrum product; homemade mixtures are not a substitute.</p>`,"span6")}
${card("Skin and acne basics",`<ul class="muted"><li>Avoid harsh scrubs, lemon juice, baking soda, and DIY bleaching remedies.</li><li>Do not pick or squeeze spots.</li><li>Acne and marks can take time; results differ for everyone.</li><li>For persistent, painful, or concerning skin problems, ask a qualified healthcare professional.</li></ul>`,"span6")}
${card("Hair and grooming",`<ul class="muted"><li>Wash your hair as needed with a gentle shampoo.</li><li>Avoid scratching your scalp or using irritating mixtures.</li><li>Choose hairstyles that feel comfortable and suit your routine.</li><li>Seek professional advice for persistent scalp problems.</li></ul>`,"span6")}
${card("Face health & posture",`<ul class="muted"><li>Facial exercises and massage cannot reliably reshape your bones or nose.</li><li>Do not use fasting, dehydration, or extreme exercise to change facial appearance.</li><li>Take screen breaks and use a comfortable, upright posture.</li><li>Focus on comfort, grooming, and confidence—not appearance scores.</li></ul>`,"span6")}
${card("Wardrobe planner",`<p class="muted">Organize outfits by comfort, weather, and occasion. Add your own clothing items and ideas.</p><form id="wardrobeForm" class="formrow"><input class="field" name="item" placeholder="Clothing item or outfit idea" required maxlength="90"><button class="btn">Add</button></form><div class="list" id="wardrobeList" style="margin-top:10px"></div>`,"span12")}`)}
function health(){return shell("Health","Build routines that support energy, learning, and wellbeing.",`
${card("Daily wellbeing checklist",`<div class="list">${["Keep a regular sleep schedule","Eat regular, balanced meals","Drink water throughout the day","Take breaks between study sessions","Make time for enjoyable movement","Connect with someone you trust"].map((s,i)=>`<label class="item"><input class="check" type="checkbox" data-health="${i}"><span class="grow">${s}</span></label>`).join("")}</div>`,"span7")}
${card("Healthy development",`<p class="muted">Puberty and development happen at different times for different people. Questions about your body or health are normal. Reliable information and support from a trusted adult or qualified healthcare professional can help.</p><div class="note">This app is educational, not a medical tool. It does not diagnose conditions or prescribe diets or treatments.</div>`,"span5")}
${card("Rest and recovery",`<p class="muted">Rest is part of progress. Adjust your routine when school, stress, or energy levels change. You do not need to earn rest.</p>`,"span12")}`)}
function profile(){return shell("Profile","Your progress is private and belongs to you.",`
${card("Hunter profile",`<form id="profileForm" class="form"><label class="muted">Display name</label><input class="field" name="name" value="${esc(data.name)}" maxlength="40"><button class="btn primary">Save profile</button></form><div class="statrow" style="margin-top:12px"><div class="stat"><strong>${data.level}</strong><small>Level</small></div><div class="stat"><strong>${rankFor(data.level)}</strong><small>Rank</small></div><div class="stat"><strong>${data.xp}</strong><small>Total XP</small></div></div>`,"span6")}
${card("Recent activity",`${data.history.slice(0,10).map(h=>`<div class="item"><div class="grow"><strong>${esc(h.title)}</strong><small>${esc(h.date)}</small></div><span class="pill">+${h.xp} XP</span></div>`).join("")||`<div class="empty">Complete a quest to see activity here.</div>`}`,"span6")}
${card("Achievements",`<div class="tilegrid">${[{n:"First Step",d:"Complete your first quest",ok:data.history.length>=1},{n:"Getting Started",d:"Complete 5 quests",ok:data.history.length>=5},{n:"Consistent Learner",d:"Complete 20 quests",ok:data.history.length>=20}].map(a=>`<div class="tile"><span>${a.ok?"🏆":"🔒"}</span><b>${a.n}</b><small>${a.ok?"Unlocked":a.d}</small></div>`).join("")}</div>`,"span12")}`)}
function settings(){return shell("Settings","Manage your data and preferences.",`
${card("Daily quest sections",`<p class="muted">Choose which areas can contribute suggested daily quests.</p>${["academy","train","develop","glow","health","skills","people"].map(s=>`<label class="item"><input type="checkbox" class="check" data-pref="${s}" ${data.prefs.enabled.includes(s)?"checked":""}><span class="grow">${labelFor(s)}</span></label>`).join("")}`,"span6")}
${card("Data management",`<p class="muted">Your app data is stored locally on this device.</p><div class="form"><button class="btn" id="exportBtn">Export backup (JSON)</button><label class="btn" for="importFile" style="text-align:center">Import backup (JSON)</label><input id="importFile" type="file" accept="application/json" hidden><button class="btn danger" id="resetBtn">Reset all app data</button></div>`,"span6")}
${card("Install & offline",`<p class="muted">Use your browser's menu and choose “Add to Home screen” when available. Offline support works after the app is hosted over HTTPS and opened once.</p><p class="muted">Notifications depend on browser support and permission. This starter app does not send notifications in the background.</p>`,"span12")}`)}
function render(){nav();let html=page==="system"?system():page==="quests"?shell("Quests","Create tasks, complete them, and earn XP.",`${card("Quest list",`<div class="section-head"><span class="muted">Manage your tasks</span><button class="btn primary" id="addQuest">+ New quest</button></div><div class="formrow" style="margin-bottom:10px"><button class="btn" data-filter="all">All</button><button class="btn" data-filter="open">Open</button><button class="btn" data-filter="done">Completed</button></div><div id="questResults">${questList("all")}</div>`,"span12")}`):page==="academy"?academy():page==="examiner"?examiner():page==="train"?simpleSection("train","Train","Movement for strength, mobility, and enjoyment.",["Bodyweight basics","Mobility & stretching","Warm-up and recovery","Workout log"]):page==="develop"?simpleSection("develop","Develop","Build useful habits at a sustainable pace.",["Focus and study habits","Reading","Journaling","Time management","Confidence"]):page==="glow"?glow():page==="health"?health():page==="skills"?simpleSection("skills","Skills","Learn practical skills with small projects.",data.skills):page==="people"?simpleSection("people","People","Practice communication, empathy, and observation.",["Active listening","Respectful communication","Public speaking","Cognitive biases","Boundaries and empathy"]):page==="profile"?profile():settings();
$("#view").innerHTML=html;
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
document.querySelectorAll("[data-add-quest]").forEach(b=>b.onclick=addQuest);
if($("#addQuest"))$("#addQuest").onclick=addQuest;
wireQuests();
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{$("#questResults").innerHTML=questList(b.dataset.filter);wireQuests()});
document.querySelectorAll("[data-subject]").forEach(b=>b.onclick=()=>{exam.subject=b.dataset.subject;modal(`<h3>${esc(exam.subject)} study</h3><p class="muted">Choose a topic to start the sample examiner.</p><form id="startExam" class="form"><input class="field" name="topic" placeholder="Topic" required><button class="btn primary">Start examiner</button></form>`);$("#startExam").onsubmit=e=>{e.preventDefault();exam.topic=new FormData(e.target).get("topic");exam.step=0;exam.show=false;closeModal();go("examiner")}});
if($("#chapterForm"))$("#chapterForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.chapters.push({name:f.get("chapter").trim(),subject:f.get("subject"),done:false});save();render()};
document.querySelectorAll("[data-chapter]").forEach(el=>el.onchange=()=>{data.chapters[+el.dataset.chapter].done=el.checked;save();render()});
document.querySelectorAll("[data-chapter-del]").forEach(el=>el.onclick=()=>{data.chapters.splice(+el.dataset.chapterDel,1);save();render()});
if($("#subjectForm"))$("#subjectForm").onsubmit=e=>{e.preventDefault();let s=new FormData(e.target).get("subject").trim();if(s&&!data.subjects.includes(s))data.subjects.push(s);save();render()};
if($("#noteForm"))$("#noteForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.notes.unshift({title:f.get("title"),body:f.get("body")});save();render();toast("Note saved")};
document.querySelectorAll("[data-note-del]").forEach(el=>el.onclick=()=>{data.notes.splice(+el.dataset.noteDel,1);save();render()});
if($("#examForm"))$("#examForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);exam.subject=f.get("subject");exam.topic=f.get("topic");exam.step=0;exam.show=false;go("examiner")};
document.querySelectorAll("[data-answer]").forEach(el=>el.onclick=()=>{exam.selected=+el.dataset.answer;exam.show=true;render()});
if($("#nextQ"))$("#nextQ").onclick=()=>{exam.step++;exam.selected=null;exam.show=false;render()};
if($("#profileForm"))$("#profileForm").onsubmit=e=>{e.preventDefault();data.name=new FormData(e.target).get("name").trim()||"Hunter";save();render();toast("Profile saved")};
document.querySelectorAll("[data-pref]").forEach(el=>el.onchange=()=>{let s=el.dataset.pref;if(el.checked&&!data.prefs.enabled.includes(s))data.prefs.enabled.push(s);if(!el.checked)data.prefs.enabled=data.prefs.enabled.filter(x=>x!==s);save()});
if($("#exportBtn"))$("#exportBtn").onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="solo-leveling-backup.json";a.click();URL.revokeObjectURL(a.href)};
if($("#importFile"))$("#importFile").onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!obj||!Array.isArray(obj.quests)||typeof obj.xp!=="number")throw Error();data={...structuredClone(initial),...obj};save();render();toast("Backup imported")}catch{toast("Invalid backup file")}};
if($("#resetBtn"))$("#resetBtn").onclick=()=>{if(confirm("Delete all SOLO LEVELING data on this device? This cannot be undone.")){data=structuredClone(initial);save();render();toast("App data reset")}};
if($("#wardrobeForm"))$("#wardrobeForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),arr=JSON.parse(localStorage.getItem("wardrobe")||"[]");arr.push(f.get("item").trim());localStorage.setItem("wardrobe",JSON.stringify(arr));render()};
if($("#wardrobeList")){let arr=JSON.parse(localStorage.getItem("wardrobe")||"[]");$("#wardrobeList").innerHTML=arr.map((x,i)=>`<div class="item"><div class="grow">${esc(x)}</div><button class="smallbtn" data-wdel="${i}">×</button></div>`).join("")||`<div class="empty">No outfit ideas yet.</div>`;document.querySelectorAll("[data-wdel]").forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.wdel,1);localStorage.setItem("wardrobe",JSON.stringify(arr));render()})}
}
$("#settingsBtn").onclick=()=>go("settings");
nav();render();
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;$("#installBtn").hidden=false});
$("#installBtn").onclick=async()=>{if(deferredInstall){deferredInstall.prompt();deferredInstall=null}else toast("Use your browser menu to install this app")};
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body></html>
